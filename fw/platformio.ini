; Cheap Yellow Display (ESP32-2432S028) driving WS2801 LEDs

[platformio]
core_dir = .pio-core
default_envs = laempli-chlotz

; One env for each firmware: laempli-<type>. The device IDs are <type>-<6 hex chars>.
; Sources: src/<type>/ for each firmware (with its config.hpp), src/common/ for code they share, src/ledchain/ for the
; firmwares with a chain of job LEDs (one LED per job: Chlotz, Stägge, Chlötzli, Chischtli, Gitta), src/chain8266/
; for the ESP8266 firmwares with a LED chain (Chlötzli, Chischtli: only a config.hpp in src/<type>/). The common code
; includes the config.hpp of the firmware: add the directories to the include path.
[env:laempli-chlotz]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
build_src_filter = +<chlotz/> +<common/> +<ledchain/>
; --wrap: own TLS cipher suites (see tlsSuites() in src/common/backend.cpp)
build_flags = -I src/chlotz -I src/common -I src/ledchain -Wl,--wrap=arduino_esp_crt_bundle_attach
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0
lib_deps =
    fastled/FastLED@3.9.4
    lovyan03/LovyanGFX@1.2.31
    olikraus/U8g2@2.36.18
    bblanchon/ArduinoJson@7.4.3
; CA bundle for HTTPS, made from Debian ca-certificates
extra_scripts =
    pre:../tools/gen_ca_bundle.py
    pre:../tools/version.py
board_build.embed_files =
    .pio/ca_bundle/x509_crt_bundle.bin
    src/chlotz/logo.png
; Bigger app partitions (1.9 MB, OTA possible), same NVS as default
board_build.partitions = min_spiffs.csv

; Wemos D1 mini (ESP8266EX, 4 MB flash): 160 MHz (faster TLS handshake), LittleFS for the settings (1 MB)
[env:laempli-hello]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
board_build.f_cpu = 160000000L
board_build.filesystem = littlefs
build_src_filter = +<hello/> +<common/>
; MMU: 16 kB of the IRAM as second heap, the core puts the TLS buffers there
build_flags = -I src/hello -I src/common -D PIO_FRAMEWORK_ARDUINO_MMU_CACHE16_IRAM48_SECHEAP_SHARED
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
lib_deps =
    fastled/FastLED@3.9.4
    bblanchon/ArduinoJson@7.4.3
; CA certificates for HTTPS, made from Debian ca-certificates
extra_scripts =
    pre:../tools/gen_ca_bundle.py
    pre:../tools/version.py

