; Gitta (ESP32-D0WDQ6 in a u-blox NINA-W102, 2 MB flash, FTDI USB serial): 6 job LEDs, buzzer, no display
[env:laempli-gitta]
platform = espressif32@6.9.0
board = esp32dev
board_upload.flash_size = 2MB
framework = arduino
build_src_filter = +<gitta/> +<common/> +<ledchain/>
; --wrap: own TLS cipher suites (see tlsSuites() in src/common/backend.cpp)
build_flags = -I src/gitta -I src/common -I src/ledchain -Wl,--wrap=arduino_esp_crt_bundle_attach
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1070NAB-if00-port0
monitor_port = /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_A1070NAB-if00-port0
lib_deps =
    fastled/FastLED@3.9.4
    bblanchon/ArduinoJson@7.4.3
; CA bundle for HTTPS, made from Debian ca-certificates
extra_scripts =
    pre:../tools/gen_ca_bundle.py
    pre:../tools/version.py
board_build.embed_files =
    .pio/ca_bundle/x509_crt_bundle.bin
; One app partition of 1.9 MB, no firmware update (OTA), see partitions-gitta.csv
board_build.partitions = partitions-gitta.csv
