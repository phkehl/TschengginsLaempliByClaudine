; WS2801 channel order test for the Chlötzli (ESP8266), not a Lämpli firmware
;
; Run in the repo root: fw/.venv/bin/pio run -d tools/test/ws2801-order -t upload

[platformio]
core_dir = ../../../fw/.pio-core
src_dir = .

[env:d1_mini]
platform = espressif8266@4.2.1
board = d1_mini
framework = arduino
monitor_speed = 115200
upload_port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
monitor_port = /dev/serial/by-id/usb-1a86_USB2.0-Serial-if00-port0
